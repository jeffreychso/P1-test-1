<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小一數學測驗隨機生成器</title>
    <style>
        body { font-family: 'Arial', sans-serif; line-height: 1.8; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 0.9em; margin-bottom: 30px; }
        .control-panel { text-align: center; margin-bottom: 30px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        button.print-btn { background-color: #2ecc71; }
        button.print-btn:hover { background-color: #27ae60; }
        .section { margin-bottom: 25px; background: #fdfdfd; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .section-title { font-weight: bold; font-size: 1.2em; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; margin-bottom: 15px; }
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
        .quiz-item { margin-bottom: 12px; font-size: 1.1em; }
        .full-width { grid-column: span 2; }
        
        /* Print layout optimizations */
        @media print {
            .control-panel { display: none; }
            body { padding: 0; max-width: 100%; }
            .section { border: none; padding: 0; margin-bottom: 30px; page-break-inside: avoid; }
            button { display: none; }
        }
    </style>
</head>
<body>

    <h1>小一數學測驗模擬練習卷</h1>
    <div class="subtitle">提示：點擊「生成全新題目」按鈕可隨機更換整張試卷的數字</div>

    <div class="control-panel">
        <button onclick="generateQuiz()">🔄 生成全新題目</button>
        <button class="print-btn" onclick="window.print()">🖨️ 列印本頁 / 儲存成PDF</button>
    </div>

    <div id="quiz-container">
        <!-- Questions will dynamically load here -->
    </div>

    <script>
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; // Clear previous items

            // --- SECTION 1: 算一算 ---
            let sec1Html = `<div class="section"><div class="section-title">一、算一算（每題空格填入正確數字）</div><div class="quiz-grid">`;
            
            // 5 Fill in the blank addition/subtraction
            for(let i=1; i<=5; i++) {
                let sum = getRandomInt(11, 18);
                let a = getRandomInt(4, sum - 4);
                let b = sum - a;
                if(Math.random() > 0.5) {
                    sec1Html += `<div class="quiz-item">${i}. ${a} + <span style="display:inline-block; width:60px; border-bottom:1px solid #000; text-align:center;">&nbsp;</span> = ${sum}</div>`;
                } else {
                    sec1Html += `<div class="quiz-item">${i}. <span style="display:inline-block; width:60px; border-bottom:1px solid #000; text-align:center;">&nbsp;</span> + ${b} = ${sum}</div>`;
                }
            }
            // 5 Subtraction fill in blank
            for(let i=6; i<=10; i++) {
                let total = getRandomInt(11, 18);
                let sub = getRandomInt(4, total - 3);
                let rem = total - sub;
                if(Math.random() > 0.5) {
                    sec1Html += `<div class="quiz-item">${i}. ${total} - <span style="display:inline-block; width:60px; border-bottom:1px solid #000; text-align:center;">&nbsp;</span> = ${rem}</div>`;
                } else {
                    sec1Html += `<div class="quiz-item">${i}. <span style="display:inline-block; width:60px; border-bottom:1px solid #000; text-align:center;">&nbsp;</span> - ${sub} = ${rem}</div>`;
                }
            }
            // 10 Word math problems
            for(let i=11; i<=20; i++) {
                if(Math.random() > 0.5) {
                    let total = getRandomInt(11, 18);
                    let take = getRandomInt(4, total - 3);
                    sec1Html += `<div class="quiz-item">${i}. ${total} 取去 ${take} 是 ____</div>`;
                } else {
                    let a = getRandomInt(4, 9);
                    let b = getRandomInt(4, 9);
                    sec1Html += `<div class="quiz-item">${i}. ${a} 和 ${b} 合起來是 ____</div>`;
                }
            }
            sec1Html += `</div></div>`;
            container.innerHTML += sec1Html;

            // --- SECTION 2: 依規律填一填 ---
            let sec2Html = `<div class="section"><div class="section-title">二、依規律，填一填</div><div class="quiz-grid">`;
            for(let i=21; i<=30; i++) {
                let type = getRandomInt(1, 3); // 1: sequence, 2: reverse, 3: skip counting
                let seq = [];
                if(type === 1) { // Normal up
                    let start = getRandomInt(1, 14);
                    for(let j=0; j<6; j++) seq.push(start + j);
                } else if (type === 2) { // Reverse down
                    let start = getRandomInt(8, 20);
                    for(let j=0; j<6; j++) seq.push(start - j);
                } else { // Even skip counting
                    let start = getRandomInt(1, 5) * 2;
                    for(let j=0; j<6; j++) seq.push(start + (j*2));
                }
                
                // Randomly hide two indices
                let idx1 = getRandomInt(1, 2);
                let idx2 = getRandomInt(4, 5);
                let displayItems = seq.map((num, idx) => (idx === idx1 || idx === idx2) ? "____" : num);
                
                sec2Html += `<div class="quiz-item">${i}. ${displayItems.join(' , ')}</div>`;
            }
            sec2Html += `</div></div>`;
            container.innerHTML += sec2Html;

            // --- SECTION 3: 數的篩選與排列 ---
            let sec3Html = `<div class="section"><div class="section-title">三、數的篩選與排列</div><div class="quiz-grid">`;
            for(let i=31; i<=40; i++) {
                let isEvenTarget = Math.random() > 0.5;
                let isSmallToBig = Math.random() > 0.5;
                
                let pool = [];
                // Generate random numbers mixture
                while(pool.length < 5) {
                    let n = getRandomInt(1, 20);
                    if(!pool.includes(n)) pool.push(n);
                }
                
                let targetLabel = isEvenTarget ? "雙數" : "單數";
                let directionLabel = isSmallToBig ? "由小至大" : "由大至小";
                let sign = isSmallToBig ? "<" : ">";
                
                sec3Html += `<div class="quiz-item full-width">${i}. 把以下的【${targetLabel}】${directionLabel}排列： &nbsp;&nbsp;&nbsp;&nbsp;<b>${pool.join(' , ')}</b><br>答案： ____ ${sign} ____ ${sign} ____</div>`;
            }
            sec3Html += `</div></div>`;
            container.innerHTML += sec3Html;

            // --- SECTION 4: 圖形代算 ---
            let sec4Html = `<div class="section"><div class="section-title">四、圖形代算</div><div class="quiz-grid">`;
            const shapes = ["★", "▲", "■", "●", "◆", "♥", "♦", "♣", "♠", "▼"];
            for(let i=41; i<=50; i++) {
                let shape = shapes[i-41];
                let ans = getRandomInt(3, 10);
                let sum = ans + ans;
                sec4Html += `<div class="quiz-item">${i}. ${shape} + ${shape} = ${sum}，那麼 ${shape} 是 ____。</div>`;
            }
            sec4Html += `</div></div>`;
            container.innerHTML += sec4Html;
        }

        // Initialize setup on load
        window.onload = generateQuiz;
    </script>
</body>
</html>
